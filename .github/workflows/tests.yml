name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Le projet MAUI n'est pas compilé ici (workloads Android/iOS) : on teste le cœur métier et les ViewModels.
      - run: dotnet test tests/InvoicingTool.Tests/InvoicingTool.Tests.csproj
