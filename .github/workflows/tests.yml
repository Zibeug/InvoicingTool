name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Cœur métier et ViewModels : testables sans téléphone ni Windows.
      - run: dotnet test tests/InvoicingTool.Tests/InvoicingTool.Tests.csproj

  windows:
    # Compile l'application Windows et publie un dossier prêt à lancer (InvoicingTool.App.exe), sans installation.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui
      # RuntimeIdentifierOverride (et non -r) : l'architecture ne doit s'appliquer qu'à la cible Windows,
      # pas aux cibles Android / iOS du même projet pendant la restauration des paquets.
      - name: Publier l'application Windows
        run: >
          dotnet publish src/InvoicingTool.App/InvoicingTool.App.csproj
          -f net10.0-windows10.0.19041.0 -c Release
          -p:RuntimeIdentifierOverride=win-x64
          -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          -o publish/windows
      - uses: actions/upload-artifact@v4
        with:
          name: DevisFactures-windows-x64
          path: publish/windows
